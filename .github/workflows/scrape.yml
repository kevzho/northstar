# The daily opportunity loop: scrape Reddit + Devpost into the shared
# candidate pool, then let the verifier promote the clear wins into
# public.opportunities so students see fresh listings.
#
# This used to be a launchd job (com.northstar.reddit-scraper) on one laptop,
# which meant no scrape happened on any day that machine was closed or asleep
# at 09:00 — StartCalendarInterval cannot fire on a sleeping Mac. Running it
# here decouples the catalog from one person's lid being open.
name: Scrape

on:
  schedule:
    # 16:17 UTC ~= 09:17 PT, keeping the old local slot. Deliberately off the
    # hour: on-the-hour crons queue behind everyone else's and get dropped.
    - cron: "17 16 * * *"
  workflow_dispatch:

# A run mutates the shared pool and upserts into Supabase. Two at once would
# spend the LLM budget twice to discover the same posts, so let a running
# scrape finish rather than racing or cancelling it.
concurrency:
  group: scrape
  cancel-in-progress: false

# Needed only by the commit-back step at the end.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A full pass is ~40 minutes: 100+ subreddit and search fetches, each
    # deliberately rate-limited to stay polite to Reddit's API.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # Fall back rather than pass through: an unset secret would export an
      # empty string, and os.getenv returns "" instead of its default for a
      # variable that is set-but-empty — which would break the verifier.
      LLM_API_BASE: ${{ secrets.LLM_API_BASE || 'https://integrate.api.nvidia.com/v1' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'openai/gpt-oss-20b' }}
      # Optional per-job override for the VERIFIER only. Unset, it falls back to
      # LLM_* above and nothing changes. Set, the nightly verify+import runs on
      # Azure AI Foundry while /advisor stays on NIM — which matters because the
      # verifier reads public listings and sends no student data, whereas the
      # advisor sends a student's own words and the privacy page names its
      # recipient by vendor.
      VERIFIER_API_KEY: ${{ secrets.VERIFIER_API_KEY }}
      VERIFIER_API_BASE: ${{ secrets.VERIFIER_API_BASE }}
      VERIFIER_MODEL: ${{ secrets.VERIFIER_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      # Fail loudly and up front. Without Reddit credentials the scraper falls
      # back to the unauthenticated endpoint and gets rate-limited into
      # returning almost nothing; without the LLM key the verifier exits
      # cleanly and imports zero. Both look like "ran fine, found nothing".
      - name: Required secrets are present
        id: secrets
        run: |
          missing=""
          for name in REDDIT_CLIENT_ID REDDIT_CLIENT_SECRET \
                      SUPABASE_URL SUPABASE_SECRET_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          # The verifier needs A provider, not a specific one. Either key will
          # do, and demanding LLM_API_KEY would block a host that had moved the
          # verifier to Azure and deliberately unset the shared key.
          if [ -z "$LLM_API_KEY" ] && [ -z "$VERIFIER_API_KEY" ]; then
            missing="$missing LLM_API_KEY-or-VERIFIER_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "Missing repo secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # A hosted model can be retired on a schedule, and this one was:
      # meta/llama-3.1-70b-instruct reached end of life 2026-08-26 and every
      # verify call 410'd for the next four weeks while this workflow stayed
      # green. Checking the completion path up front turns the next
      # retirement into a red build on day one, with the live list of
      # replacements printed in the log.
      - name: Configured LLM model is alive
        run: python scripts/check_llm.py

      # scrape_all.py now exits non-zero when the verify+import stage cannot
      # judge anything. The scrapers are still allowed to fail softly.
      - name: Scrape, verify, import
        run: python scripts/scrape_all.py

      # Importing only ever ADDS. Without this step the catalog grows
      # monotonically and fills with hackathons that closed weeks ago: on
      # 2026-09-25 that was 100 of 186 live rows, and /catalog ordered by
      # deadline, so browse opened on the most expired one. Retiring one-off
      # scraped events whose deadline has passed is the other half of a daily
      # scrape. Curated annual programmes are reported, never auto-retired —
      # see the script's docstring for why that distinction is not optional.
      #
      # Runs even if the scrape itself failed, because expiry is a function of
      # the date and not of today's haul — a broken scraper is no reason to keep
      # showing closed hackathons. Gated on the secrets check rather than
      # always(), so a credential-less run reports one clear failure instead of
      # two, and never a silent success.
      - name: Retire expired scraped events
        # always() is load-bearing: GitHub implicitly ANDs success() into any
        # `if` that does not reference a status function, so the bare
        # steps.secrets comparison would skip this whenever the scrape failed —
        # the exact case where stale rows most need clearing.
        if: always() && steps.secrets.outcome == 'success'
        run: python scripts/expire_opportunities.py

      # The pool is the scrapers' memory of what they have already seen, so it
      # has to persist between runs or every day rediscovers the same posts as
      # "new". The imported opportunities themselves already went to Supabase.
      # Only on success. Committing a grown pool after a failed verify pass
      # is what made the outage legible as progress: 28 daily commits, each
      # one real, none of them reaching the catalog.
      - name: Commit the refreshed candidate pool
        if: success()
        run: |
          git config user.name "Kevin Zhou"
          git config user.email "86838731+kevzho@users.noreply.github.com"
          git add scripts/scraped/reddit_candidates.json
          if git diff --cached --quiet; then
            echo "No new candidates; nothing to commit."
            exit 0
          fi
          # [skip ci] because a data-only change cannot affect the build, and
          # CI minutes on a private repo are worth more than a redundant run.
          git commit -m "Daily scrape: refresh candidate pool [skip ci]"
          # Land on top of anything pushed while the scrape was running.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Last, and deliberately after the commit above. The landing page states
      # exact counts for the high-school shelf, and the steps in this job are
      # what change them — retiring expired events moves the number the page
      # claims. Three times now, a correctness fix to the data has silently
      # turned a truthful sentence on the page into a false one, because
      # tests/test_impact_claims.py runs without credentials and can only bound
      # the claim from above. Checking it here, where the credentials are,
      # surfaces the drift the same day.
      #
      # Placed after the pool commit so a stale sentence reddens the build
      # without also throwing away the day's scrape: the pool is the scrapers'
      # memory, and losing it means tomorrow rediscovers everything.
      - name: Landing page counts still match the catalog
        if: always() && steps.secrets.outcome == 'success'
        run: python scripts/check_impact_claims.py
